name: Build Snail IDE web editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - name: Install pnpm
        run: npm install --global pnpm@8.15.9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build editor
        run: pnpm run build
      - name: Find output
        run: find build dist -maxdepth 2 -name index.html -print 2>/dev/null || true
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: snail-ide-browser-build
          path: |
            build/
            dist/
          if-no-files-found: error
