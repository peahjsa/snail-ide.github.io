name: Build Snail IDE web editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@8 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Show available build commands
        run: node -e "console.log(JSON.stringify(require('./package.json').scripts,null,2))"
      - name: Build editor
        run: pnpm run build
      - name: Locate browser output
        run: |
          find . -maxdepth 3 -name index.html -not -path './node_modules/*' -print
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: snail-ide-browser-build
          path: |
            build/
            dist/
          if-no-files-found: error
